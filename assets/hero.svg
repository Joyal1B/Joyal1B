<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="Sam The SpaceJoker, Oussama Labhih, fondateur de NullAgency.on. Un humain, une meute d'agents IA.">
<style>
  .link{stroke-dasharray:4 10;animation:flow 1.6s linear infinite}
  .pulse{offset-rotate:0deg;animation:travel 2.8s cubic-bezier(.6,0,.4,1) infinite}
  .node{animation:breathe 4s ease-in-out infinite}
  .eye{animation:glow 3.2s ease-in-out infinite}
  .ring{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
  .ring2{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite reverse}
  .fade{opacity:0;animation:in .9s ease-out forwards}
  .caret{animation:blink 1.1s steps(2,start) infinite}
  @keyframes flow{to{stroke-dashoffset:-28}}
  @keyframes travel{0%{offset-distance:0%;opacity:0}15%{opacity:1}85%{opacity:1}100%{offset-distance:100%;opacity:0}}
  @keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
  @keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes blink{to{visibility:hidden}}
  @media (prefers-reduced-motion:reduce){.link,.pulse,.node,.eye,.ring,.ring2,.caret{animation:none}.pulse{display:none}.fade{animation:none;opacity:1}}
</style>
<defs>
  <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset=".55" stop-color="#b8c6db"/><stop offset="1" stop-color="#7e90ab"/></linearGradient>
  <radialGradient id="eyeg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#bdf6ff"/><stop offset=".6" stop-color="#36e0ff"/><stop offset="1" stop-color="#0098c4"/></radialGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#36e0ff" stop-opacity=".28"/><stop offset=".6" stop-color="#8b5cf6" stop-opacity=".08"/><stop offset="1" stop-color="#0a0e16" stop-opacity="0"/></radialGradient>
  <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#f4f7fc"/><stop offset=".7" stop-color="#d6f8ff"/><stop offset="1" stop-color="#36e0ff"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#36e0ff" stop-opacity="0"/><stop offset=".3" stop-color="#36e0ff"/><stop offset=".7" stop-color="#8b5cf6"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1a2333" stroke-width="1"/></pattern>
  <radialGradient id="vignette" cx=".3" cy=".5" r=".9"><stop offset=".4" stop-color="#0a0e16" stop-opacity="0"/><stop offset="1" stop-color="#0a0e16" stop-opacity=".95"/></radialGradient>
  <filter id="eg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <symbol id="wolf" viewBox="0 0 300 300">
    <path d="M72 48 L110 96 L150 86 L190 96 L228 48 L206 108 L236 128 L214 150 L230 176 L198 196 L214 210 L184 224 L150 250 L116 224 L86 210 L102 196 L70 176 L86 150 L64 128 L94 108 Z" fill="url(#fur)"/>
    <path d="M150 86 L150 250 L116 224 L86 210 L102 196 L70 176 L86 150 L64 128 L94 108 L72 48 L110 96 Z" fill="#000" opacity=".10"/>
    <path d="M150 86 L190 96 L228 48 L206 108 L236 128 L214 150 L230 176 L198 196 L214 210 L184 224 L150 250 Z" fill="#fff" opacity=".06"/>
    <path d="M150 178 L132 206 L150 224 L168 206 Z" fill="#3a4761" opacity=".55"/>
    <polygon points="150,196 140,210 160,210" fill="#0a0e16"/>
    <g class="eye"><polygon points="168,150 202,136 192,166" fill="url(#eyeg)" filter="url(#eg)"/><polygon points="132,150 98,136 108,166" fill="url(#eyeg)" filter="url(#eg)"/></g>
  </symbol>
</defs>

<rect width="1280" height="460" rx="24" fill="#0a0e16"/>
<rect width="1280" height="460" rx="24" fill="url(#grid)" opacity=".6"/>
<rect width="1280" height="460" rx="24" fill="url(#vignette)"/>
<circle cx="250" cy="230" r="230" fill="url(#halo)"/>
<rect x="1" y="1" width="1278" height="458" rx="23" fill="none" stroke="#1a2333" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="3" fill="url(#edge)"/>

<!-- orbits -->
<circle cx="250" cy="230" r="150" fill="none" stroke="#36e0ff" stroke-opacity=".18" stroke-dasharray="2 8" class="ring"/>
<circle cx="250" cy="230" r="196" fill="none" stroke="#8b5cf6" stroke-opacity=".16" stroke-dasharray="1 12" class="ring2"/>

<!-- links: wolf (250,230) to each agent -->
<g fill="none" stroke-width="1.6">
  <path id="l1" d="M250 230 L118 92" stroke="#36e0ff" stroke-opacity=".55" class="link"/>
  <path id="l2" d="M250 230 L392 86" stroke="#8b5cf6" stroke-opacity=".6" class="link"/>
  <path id="l3" d="M250 230 L436 262" stroke="#34d399" stroke-opacity=".55" class="link"/>
  <path id="l4" d="M250 230 L332 398" stroke="#fbbf24" stroke-opacity=".5" class="link"/>
  <path id="l5" d="M250 230 L86 352" stroke="#f472b6" stroke-opacity=".5" class="link"/>
</g>
<g>
  <circle r="3.5" fill="#36e0ff" class="pulse" style="offset-path:path('M250 230 L118 92')"/>
  <circle r="3.5" fill="#8b5cf6" class="pulse" style="offset-path:path('M250 230 L392 86');animation-delay:.5s"/>
  <circle r="3.5" fill="#34d399" class="pulse" style="offset-path:path('M250 230 L436 262');animation-delay:1s"/>
  <circle r="3.5" fill="#fbbf24" class="pulse" style="offset-path:path('M250 230 L332 398');animation-delay:1.5s"/>
  <circle r="3.5" fill="#f472b6" class="pulse" style="offset-path:path('M250 230 L86 352');animation-delay:2s"/>
</g>

<!-- agent nodes -->
<g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
  <g class="node"><rect x="58" y="70" width="120" height="44" rx="12" fill="#0f1623" stroke="#36e0ff" stroke-opacity=".7"/><text x="118" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#36e0ff">COCO</text><text x="118" y="106" text-anchor="middle" font-size="10" fill="#5b6b82">claude code · wsl</text></g>
  <g class="node" style="animation-delay:.8s"><rect x="332" y="64" width="120" height="44" rx="12" fill="#0f1623" stroke="#8b5cf6" stroke-opacity=".75"/><text x="392" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#a78bfa">CODEX</text><text x="392" y="100" text-anchor="middle" font-size="10" fill="#5b6b82">gpt-5.5 · windows</text></g>
  <g class="node" style="animation-delay:1.6s"><rect x="378" y="240" width="116" height="44" rx="12" fill="#0f1623" stroke="#34d399" stroke-opacity=".7"/><text x="436" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">HERMES</text><text x="436" y="276" text-anchor="middle" font-size="10" fill="#5b6b82">vps · telegram</text></g>
  <g class="node" style="animation-delay:2.4s"><rect x="274" y="376" width="116" height="44" rx="12" fill="#0f1623" stroke="#fbbf24" stroke-opacity=".65"/><text x="332" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">JEV</text><text x="332" y="412" text-anchor="middle" font-size="10" fill="#5b6b82">juge typé</text></g>
  <g class="node" style="animation-delay:3.2s"><rect x="18" y="330" width="136" height="44" rx="12" fill="#0f1623" stroke="#f472b6" stroke-opacity=".65"/><text x="86" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#f472b6">MUSE</text><text x="86" y="366" text-anchor="middle" font-size="10" fill="#5b6b82">direction artistique</text></g>
</g>

<!-- the pack leader -->
<circle cx="250" cy="230" r="78" fill="#36e0ff" opacity=".10" filter="url(#soft)"/>
<rect x="180" y="160" width="140" height="140" rx="36" fill="#0f1623" stroke="#36e0ff" stroke-width="2.5"/>
<use href="#wolf" x="191" y="167" width="118" height="118"/>

<!-- copy -->
<g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
  <text x="560" y="98" font-size="14" letter-spacing="3.5" fill="#36e0ff" class="fade">NULLAGENCY.ON  ·  ONE HUMAN · A PACK OF AGENTS</text>
</g>
<text x="556" y="172" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-1.5" fill="url(#title)" class="fade" style="animation-delay:.15s">Sam The SpaceJoker</text>
<text x="560" y="214" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#8fa3bf" class="fade" style="animation-delay:.3s"><tspan fill="#f4f7fc" font-weight="700">Oussama Labhih</tspan> · fondateur, chef de meute</text>
<text x="560" y="250" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#8fa3bf" class="fade" style="animation-delay:.4s">Agents IA, automatisation et sites web, livrés en production.</text>

<g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" font-weight="700" letter-spacing="1.5" class="fade" style="animation-delay:.55s">
  <rect x="560" y="284" width="196" height="36" rx="18" fill="#36e0ff" fill-opacity=".12" stroke="#36e0ff" stroke-opacity=".6"/>
  <text x="658" y="307" text-anchor="middle" fill="#36e0ff">CLIENTS · ÇA VEND</text>
  <rect x="768" y="284" width="232" height="36" rx="18" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".7"/>
  <text x="884" y="307" text-anchor="middle" fill="#a78bfa">RECRUTEURS · ÇA TIENT</text>
  <rect x="1012" y="284" width="226" height="36" rx="18" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".6"/>
  <text x="1125" y="307" text-anchor="middle" fill="#34d399">ÉQUIPES · ÇA S'OUVRE</text>
</g>

<g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" class="fade" style="animation-delay:.7s">
  <line x1="560" y1="352" x2="1238" y2="352" stroke="#1a2333" stroke-width="1.5"/>
  <text x="560" y="398" font-size="30" font-weight="800" fill="#f4f7fc">1 000+</text>
  <text x="560" y="420" font-size="11.5" letter-spacing="1.5" fill="#5b6b82">CONTRIBUTIONS / AN</text>
  <text x="790" y="398" font-size="30" font-weight="800" fill="#34d399">6</text>
  <text x="790" y="420" font-size="11.5" letter-spacing="1.5" fill="#5b6b82">SITES CLIENTS EN LIGNE</text>
  <text x="1030" y="398" font-size="30" font-weight="800" fill="#36e0ff">5</text>
  <text x="1030" y="420" font-size="11.5" letter-spacing="1.5" fill="#5b6b82">AGENTS DANS LA MEUTE</text>
</g>
</svg>
